{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Meelad Fest</title>
  <meta name="theme-color" content="#4f46e5">
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #f3f4f6; font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #1f2937; padding: 1.5rem;
    }
    .card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 1rem;
      box-shadow: 0 1px 3px rgba(0,0,0,.08); padding: 2.5rem 2rem; max-width: 26rem;
      text-align: center;
    }
    .badge {
      width: 4rem; height: 4rem; border-radius: 1rem; margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, #6366f1, #7c3aed);
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 1.25rem; margin: 0 0 .5rem; }
    p { color: #6b7280; font-size: .925rem; line-height: 1.6; margin: 0 0 1.5rem; }
    a.retry {
      display: inline-block; background: #4f46e5; color: #fff; text-decoration: none;
      font-weight: 600; font-size: .9rem; padding: .65rem 1.5rem; border-radius: .6rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l22 22M16.72 11.06A10.94 10.94 0 0119 12.55M5 12.55a10.94 10.94 0 015.17-2.39M10.71 5.05A16 16 0 0122.58 9M1.42 9a15.91 15.91 0 014.7-2.88M8.53 16.11a6 6 0 016.95 0M12 20h.01"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>The Meelad Fest app couldn't reach the server. Check the connection and try again — any marks you saved while offline will sync automatically once you're back.</p>
    <a class="retry" href="javascript:location.reload()">Try again</a>
  </div>
</body>
</html>
