<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meelad Fest - Result Poster</title>

<style>
:root {
    --poster-bg: #dda5e7;
    --navy: #24275e;
    --white: #ffffff;
    --text: #111111;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: #eeeeee;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 24px;
}

.poster {
    position: relative;
    width: 1200px;
    height: 1200px;
    overflow: hidden;
    background: var(--poster-bg);
    color: var(--text);
}

/* ================= HEADER ================= */

.hero {
    position: absolute;
    top: 0;
    left: 162px;
    width: 858px;
    height: 575px;
    background: var(--navy);
    border-radius: 0 0 90px 90px;
    overflow: hidden;
}

.hero-blob {
    position: absolute;
    width: 500px;
    height: 500px;
    top: -165px;
    left: -105px;
    background: linear-gradient(135deg, #b94bc0, #a84cb5);
    border-radius: 50%;
}

.result-pill {
    position: absolute;
    top: 267px;
    left: 84px;
    width: 395px;
    height: 58px;
    border-radius: 32px;
    background: white;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 0 22px;
    font-size: 28px;
    color: #444;
}

.search-icon {
    width: 20px;
    height: 20px;
    border: 4px solid #8b8b8b;
    border-radius: 50%;
    position: relative;
    flex: 0 0 auto;
}

.search-icon::after {
    content: "";
    position: absolute;
    width: 9px;
    height: 4px;
    background: #8b8b8b;
    transform: rotate(45deg);
    right: -7px;
    bottom: -4px;
    border-radius: 2px;
}

.program-block {
    position: absolute;
    left: 117px;
    bottom: 43px;
    width: 430px;
    color: white;
}

.program-section {
    font-size: 27px;
    line-height: 1.05;
    margin-bottom: 10px;
    text-transform: uppercase;
}

.program-name {
    font-size: 48px;
    line-height: .95;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: -1px;
}

.program-code {
    font-size: 42px;
    line-height: 1;
    font-weight: 800;
}

.fest-logo {
    position: absolute;
    right: 48px;
    bottom: 56px;
    width: 325px;
}

/* ================= WINNERS ================= */

.winner-grid {
    position: absolute;
    top: 610px;
    left: 173px;
    width: 855px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.winner-card {
    height: 350px;
    background: white;
    border-radius: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 90px 18px 20px;
    text-align: center;
}

.rank {
    font-size: 59px;
    line-height: 1;
    font-weight: 400;
    margin-bottom: 46px;
}

.winner-name {
    font-size: 28px;
    line-height: 1.15;
    font-weight: 800;
    text-transform: uppercase;
    margin-bottom: 10px;
    word-break: break-word;
}

.winner-team {
    font-size: 21px;
    line-height: 1.15;
    text-transform: uppercase;
    word-break: break-word;
}

.winner-extra {
    margin-top: 8px;
    font-size: 15px;
    color: #555;
}

/* ================= MESSAGE ================= */

.message {
    position: absolute;
    top: 989px;
    left: 207px;
    width: 790px;
    text-align: left;
    font-size: 13px;
    line-height: 1.38;
    text-transform: uppercase;
    color: #303030;
}

/* ================= FOOTER ================= */

.footer {
    position: absolute;
    bottom: 54px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #3d3d3d;
    font-weight: 800;
    text-transform: uppercase;
}

.footer-main {
    font-size: 24px;
    line-height: 1.15;
}

.footer-sub {
    margin-top: 3px;
    font-size: 17px;
    line-height: 1.15;
}

/* ================= PRINT ================= */

@page {
    size: 1200px 1200px;
    margin: 0;
}

@media print {
    html, body {
        width: 1200px;
        height: 1200px;
        padding: 0;
        background: transparent;
    }

    .poster {
        margin: 0;
    }
}
</style>
</head>

<body>

<div class="poster" id="poster">

    <section class="hero">
        <div class="hero-blob"></div>

        <div class="result-pill">
            <span class="search-icon"></span>
            <span id="resultNumber">Result 01</span>
        </div>

        <div class="program-block">
            <div class="program-section" id="sectionName"></div>
            <div class="program-name" id="programName"></div>
            <div class="program-code" id="programCode"></div>
        </div>

<script>
/*
=========================================================
MEELAD FEST POSTER DATA
=========================================================

For normal browser testing, edit the values below.

In Django, you can replace this object with data generated
from your Result / Program / Student / Team / Madrasa models.

Available variables:
- result_number
- section
- category
- program_name
- program_code
- logo (data URI of the madrasa fest_logo; when omitted/empty the built-in
        fest logo rendered by the <img id="festLogo"> is used as the default)
- winners[]
- message
- organization_name
- organization_sub
=========================================================
*/

const POSTER_DATA = {
    result_number: "01",

    section: "SUPER SENIOR (BOYS)",
    category: "LANGUAGE",
    program_name: "WORD FIGHT",
    program_code: "(ARB)",

    winners: [
        {
            rank: "01",
            name: "FAIZAN KM",
            team: "SKYLINE",
            extra: ""
        },
        {
            rank: "02",
            name: "NAFSAN",
            team: "HORIZON",
            extra: ""
        },
        {
            rank: "03",
            name: "RIZWAN",
            team: "BEACON",
            extra: ""
        }
    ],

    message:
        "WITH IMMENSE JOY AND PRIDE, WE EXTEND OUR HEARTIEST " +
        "CONGRATULATIONS TO ALL THE BRILLIANT WINNERS OF THE " +
        "AL-HUBB MEELAD FEST. YOUR ACHIEVEMENT IS NOT MERELY " +
        "A PRIZE OR A POSITION—IT IS A REFLECTION OF YOUR " +
        "DEDICATION, HARD WORK, TALENT, DISCIPLINE, AND " +
        "SINCERE EFFORT. EVERY MOMENT YOU SPENT PREPARING, " +
        "EVERY CHALLENGE YOU FACED, AND EVERY STEP YOU TOOK " +
        "TOWARDS EXCELLENCE HAS BROUGHT YOU TO THIS BEAUTIFUL " +
        "MOMENT OF SUCCESS.",

    organization_name:
        "NOORUL ISLAM MADRASA MAYANMUKKU",

    organization_sub:
        "KANHIRODE MUSLIM JAMA'ATH COMMITTEE"
};


/* ================= RENDER ================= */

function renderPoster(data) {

    document.getElementById("resultNumber").textContent =
        "Result " + (data.result_number || "01");

    /* Use the madrasa's uploaded fest logo (data URI) when present; otherwise
       keep the built-in fest logo already rendered on <img id="festLogo">. */
    if (data.logo) {
        document.getElementById("festLogo").src = data.logo;
    }

    document.getElementById("sectionName").textContent =
        data.section || "";

    document.getElementById("programName").textContent =
        data.program_name || "";

    document.getElementById("programCode").textContent =
        data.program_code || "";

    document.getElementById("congratulations").textContent =
        data.message || "";

    document.getElementById("organizationName").textContent =
        data.organization_name || "";

    document.getElementById("organizationSub").textContent =
        data.organization_sub || "";

    const grid = document.getElementById("winnerGrid");
    grid.innerHTML = "";

    (data.winners || []).forEach(function(winner) {

        const card = document.createElement("div");
        card.className = "winner-card";

        card.innerHTML = `
            <div class="rank">${escapeHtml(winner.rank || "")}</div>

            <div class="winner-name">
                ${escapeHtml(winner.name || "")}
            </div>

            <div class="winner-team">
                ${escapeHtml(winner.team || "")}
            </div>

            ${
                winner.extra
                ? `<div class="winner-extra">${escapeHtml(winner.extra)}</div>`
                : ""
            }
        `;

        grid.appendChild(card);
    });
}


/* Prevent HTML injection from database values. */
function escapeHtml(value) {
    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


renderPoster(POSTER_DATA);
</script>
