

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-indigo-50 to-purple-50 min-h-screen p-8">

<!-- Header -->
<header class="mb-10">
  <div class="flex flex-col items-center md:flex-row md:justify-between">

    <!-- Left: Title + Subtitle -->
    <div class="text-center md:text-left mb-4 md:mb-0">
      <h1 class="text-4xl font-extrabold text-indigo-700 drop-shadow-sm">
        🏆 Team Dashboard
      </h1>
      <p class="text-gray-500 mt-1">Manage your teams and add new ones</p>
    </div>

    <!-- Right: Buttons -->
    {% if request.user.is_authenticated %}
    <div class="flex space-x-3">
      <a href="{% url 'home' %}"
         class="px-5 py-2 bg-white text-indigo-600 font-semibold rounded-xl shadow hover:bg-gray-100 transition">
        Home
      </a>
      <a href="{% url 'logout' %}"
         class="px-5 py-2 bg-white text-indigo-600 font-semibold rounded-xl shadow hover:bg-gray-100 transition">
        Logout
      </a>
    </div>
    {% endif %}
  </div>
</header>



  <!-- Teams Grid -->
  <div class="grid gap-8 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">

    {% for team in teams %}
    <!-- Team Card -->
    <a href="{% url 'edit_marks' team.id %}" class="group relative bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transform hover:-translate-y-1 transition">
      <div class="h-32 bg-gradient-to-r from-indigo-500 to-purple-600 flex items-center justify-center">
        <span class="text-5xl font-extrabold text-white">{{ team.name|slice:":1"|upper }}</span>
      </div>
      <div class="p-5">
        <h2 class="text-xl font-semibold text-gray-800 group-hover:text-indigo-600 transition">{{team.name}}</h2>
        <p class="text-gray-500 text-sm mt-1">{{team.leader}}</p>
      </div>
    </a>

    {% endfor %}

<!--    &lt;!&ndash; Another Team &ndash;&gt;-->
<!--    <a href="#" class="group relative bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transform hover:-translate-y-1 transition">-->
<!--      <div class="h-32 bg-gradient-to-r from-green-400 to-emerald-600 flex items-center justify-center">-->
<!--        <span class="text-5xl font-extrabold text-white">B</span>-->
<!--      </div>-->
<!--      <div class="p-5">-->
<!--        <h2 class="text-xl font-semibold text-gray-800 group-hover:text-green-600 transition">Beta Team</h2>-->
<!--        <p class="text-gray-500 text-sm mt-1">8 Members</p>-->
<!--      </div>-->
<!--    </a>-->

    <!-- Add New Team Block -->
    <a href="{% url 'add_team' %}"
       class="flex flex-col items-center justify-center bg-white border-2 border-dashed border-gray-300 rounded-2xl shadow-sm hover:border-indigo-500 hover:bg-indigo-50 hover:shadow-md transition">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 text-gray-400 group-hover:text-indigo-500 mb-3 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
      </svg>
      <span class="text-lg font-semibold text-gray-500 group-hover:text-indigo-600">Add New Team</span>
    </a>
  </div>

</body>
</html>
