{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  {% include 'header.html' with sticky_header='true' %}

  <div class="max-w-6xl mx-auto p-4 sm:p-6 pt-24 sm:pt-28">

    <div class="bg-white shadow-sm py-6 mb-8 rounded-lg">
      <div class="max-w-6xl mx-auto px-4">
        <div class="text-left">
          <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold text-indigo-700 drop-shadow-sm">
            👥 Teams Dashboard
          </h1>
          <p class="text-gray-500 mt-1 text-sm sm:text-base">Manage your teams</p>
        </div>
      </div>
    </div>


    <!-- Teams Grid -->
    <div class="grid gap-8 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
      {% for team in teams %}
      <!-- Team Card -->
      <a href="{% url 'categories' %}?team={{ team.id }}"
        class="group relative bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transform hover:-translate-y-1 transition">
        <div class="h-32 bg-gradient-to-r from-indigo-500 to-purple-600 flex items-center justify-center">
          <span class="text-5xl font-extrabold text-white">{{ team.name|slice:":1"|upper }}</span>
        </div>
        <div class="p-5">
          <h2 class="text-xl font-semibold text-gray-800 group-hover:text-indigo-600 transition">{{team.name}}</h2>
          <p class="text-gray-500 text-sm mt-1">{{team.leader}}</p>
        </div>
      </a>
      {% endfor %}

      <!-- Add New Team Block -->
      <button onclick="openTeamModal()"
        class="flex flex-col items-center justify-center bg-white border-2 border-dashed border-gray-300 rounded-2xl shadow-sm hover:border-indigo-500 hover:bg-indigo-50 hover:shadow-md transition">
        <svg xmlns="http://www.w3.org/2000/svg"
          class="h-14 w-14 text-gray-400 group-hover:text-indigo-500 mb-3 transition" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <span class="text-lg font-semibold text-gray-500 group-hover:text-indigo-600">Add New Team</span>
      </button>
    </div>

    <!-- Add Team Modal -->
    <div id="teamModal" class="fixed inset-0 hidden bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-6 relative">
        <button onclick="closeTeamModal()"
          class="absolute top-3 right-3 text-gray-400 hover:text-gray-600">&times;</button>

        <h2 class="text-2xl font-bold text-indigo-700 mb-6">Add Team</h2>

        <form method="post" action="{% url 'add_team' %}" class="space-y-4">
          {% csrf_token %}

          <div>
            <label class="block text-sm font-medium text-gray-700">Team Name</label>
            <input type="text" name="name"
              class="mt-1 w-full border rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500" required>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Team Leader</label>
            <input type="text" name="leader"
              class="mt-1 w-full border rounded-lg p-2 focus:ring-indigo-500 focus:border-indigo-500" required>
          </div>

          <div class="flex justify-end space-x-2">
            <button type="button" onclick="closeTeamModal()" class="px-4 py-2 bg-gray-200 rounded-xl">Cancel</button>
            <button type="submit"
              class="px-4 py-2 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script>


      function copyFormLink() {
        const formUrl = "{{ form_url }}";
        navigator.clipboard.writeText(formUrl).then(() => { alert("Form URL copied to clipboard!"); })
          .catch(() => { alert("Failed to copy URL."); });
      }

      // Team Modal
      function openTeamModal() { document.getElementById("teamModal").classList.remove("hidden"); }
      function closeTeamModal() { document.getElementById("teamModal").classList.add("hidden"); }
    </script>

  </div>




</body>
