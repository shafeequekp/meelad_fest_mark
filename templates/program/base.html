{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Digital: Meelad Program{% endblock %}</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS / Animations -->
  <style>
    @keyframes fadeEffect {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade {
      animation: fadeEffect 1s ease-in-out;
    }

    @keyframes finalSlideAnimation {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }

      60% {
        transform: scale(1.1);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .animate-finalSlide {
      animation: finalSlideAnimation 2s ease-out forwards;
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .card-animate {
      animation: fadeUp 0.8s ease-out forwards;
      opacity: 0;
    }

    .card-animate:nth-child(1) {
      animation-delay: 0.1s;
    }

    .card-animate:nth-child(2) {
      animation-delay: 0.3s;
    }

    .card-animate:nth-child(3) {
      animation-delay: 0.5s;
    }

    .card-animate:nth-child(4) {
      animation-delay: 0.7s;
    }

    .card-animate:nth-child(5) {
      animation-delay: 0.9s;
    }

    .card-animate:nth-child(6) {
      animation-delay: 1.1s;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-in {
      animation: fadeIn 1s ease-out forwards;
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>

<body class="bg-gray-100 font-sans">

  <!-- Header -->
  {% include 'header.html' %}

  <!-- Page Title Bar -->
  <div class="bg-white shadow-sm py-4 mb-6">
    <div class="max-w-7xl mx-auto px-4">
      <h1 class="text-2xl sm:text-3xl font-bold text-center text-indigo-700">
        🏆 {% block header_title %}{{ meelad_fest_name }} Dashboard{% endblock %}
      </h1>
    </div>
  </div>

  <!-- Main Content -->
  <main class="p-4 sm:p-6">
    {% block content %}{% endblock %}
  </main>


  <!-- JS -->


  {% block extra_js %}{% endblock %}



</body>

</html>
