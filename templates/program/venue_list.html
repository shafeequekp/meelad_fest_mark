{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teams</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-r from-indigo-50 to-purple-50 min-h-screen p-8">
  <div class="max-w-6xl mx-auto">
    <!-- Header -->
    {% include 'header.html' %}

    <div class="bg-white shadow-sm py-6 mb-8">
      <div class="max-w-6xl mx-auto px-4">
        <div class="text-left">
          <h1 class="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-extrabold text-indigo-700 drop-shadow-sm">
            Venue Management
          </h1>
          <p class="text-gray-500 mt-1 text-sm sm:text-base">Manage your venues</p>
        </div>
      </div>
    </div>


    <!-- Venues Grid -->
    <div class="grid gap-8 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4">
      {% for venue in venues %}
      <!-- Venue Card -->
      <a href="{% url 'venue_detail' venue.id %}"
        class="group relative bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transform hover:-translate-y-1 transition">

        <div class="h-32 bg-gradient-to-r from-emerald-500 to-green-600 flex items-center justify-center">
          <span class="text-5xl font-extrabold text-white">
            {{ venue.name|slice:":1"|upper }}
          </span>
        </div>

        <div class="p-5">
          <h2 class="text-xl font-semibold text-gray-800 group-hover:text-emerald-600 transition">
            {{ venue.name }}
          </h2>

          <p class="text-gray-500 text-sm mt-1">
            {{ venue.location }}
          </p>
        </div>

      </a>
      {% endfor %}

      <!-- Add New Venue Block -->
      <button onclick="openVenueModal()"
        class="flex flex-col items-center justify-center bg-white border-2 border-dashed border-gray-300 rounded-2xl shadow-sm hover:border-emerald-500 hover:bg-emerald-50 hover:shadow-md transition">
        <svg xmlns="http://www.w3.org/2000/svg"
          class="h-14 w-14 text-gray-400 group-hover:text-emerald-500 mb-3 transition" fill="none" viewBox="0 0 24 24"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        <span class="text-lg font-semibold text-gray-500 group-hover:text-emerald-600">Add New Venue</span>
      </button>
    </div>

    <!-- Add Venue Modal -->
    <div id="venueModal" class="fixed inset-0 hidden bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-6 relative">
        <button onclick="closeVenueModal()"
          class="absolute top-3 right-3 text-gray-400 hover:text-gray-600">&times;</button>

        <h2 class="text-2xl font-bold text-emerald-700 mb-6">Add Venue</h2>

        <form method="post" action="{% url 'add_venue' %}" class="space-y-4">
          {% csrf_token %}

          <div>
            <label class="block text-sm font-medium text-gray-700">Venue Name</label>
            <input type="text" name="name"
              class="mt-1 w-full border rounded-lg p-2 focus:ring-emerald-500 focus:border-emerald-500" required>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700">Location</label>
            <input type="text" name="description"
              class="mt-1 w-full border rounded-lg p-2 focus:ring-emerald-500 focus:border-emerald-500" required>
          </div>

          <div class="flex justify-end space-x-2">
            <button type="button" onclick="closeVenueModal()" class="px-4 py-2 bg-gray-200 rounded-xl">Cancel</button>
            <button type="submit"
              class="px-4 py-2 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      function openVenueModal() {
        document.getElementById("venueModal").classList.remove("hidden");
      }
      function closeVenueModal() {
        document.getElementById("venueModal").classList.add("hidden");
      }
    </script>


    <script>


      function copyFormLink() {
        const formUrl = "{{ form_url }}";
        navigator.clipboard.writeText(formUrl).then(() => { alert("Form URL copied to clipboard!"); })
          .catch(() => { alert("Failed to copy URL."); });
      }

      // Team Modal
      function openTeamModal() { document.getElementById("teamModal").classList.remove("hidden"); }
      function closeTeamModal() { document.getElementById("teamModal").classList.add("hidden"); }
    </script>

  </div>




</body>
