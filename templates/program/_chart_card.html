{% comment %}
Reusable chart card for the Fest Analytics section.
Parameters: chart_id, title, subtitle, icon
{% endcomment %}
<div class="bg-gray-50 rounded-xl border border-gray-100 p-4">
  <div class="flex justify-between items-start gap-2">
    <div>
      <h3 class="font-bold text-gray-800 text-sm inline-flex items-center gap-2">
        <span class="shrink-0">{% include 'program/_icon.html' with name=icon %}{{ title }}</span>
      </h3>
      <p class="text-xs text-gray-500">{{ subtitle }}</p>
    </div>
    <button type="button" data-chart-download="{{ chart_id }}" data-no-skeleton title="Download as PNG"
            class="shrink-0 p-1.5 rounded-lg text-gray-400 hover:text-indigo-600 hover:bg-indigo-50 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a1 1 0 001 1h14a1 1 0 001-1v-2M12 4v12m0 0l-4-4m4 4l4-4"/>
      </svg>
    </button>
  </div>
  <div class="mt-3 h-64 relative">
    <canvas id="{{ chart_id }}" role="img" aria-label="{{ title }}"></canvas>
  </div>
</div>
