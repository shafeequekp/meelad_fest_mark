{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload Students - Digital: Meelad Program</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans">

  <!-- ✅ Reused Header -->
  {% include 'header.html' %}

  <div class="bg-white shadow-sm py-4 mb-6">
    <div class="max-w-7xl mx-auto px-4 flex items-center justify-center relative">
      <h1 class="text-2xl sm:text-3xl font-bold text-center text-indigo-700">
        🏆 {{ meelad_fest_name }} Student Upload
      </h1>
    </div>
  </div>



  <!-- ✅ Student Upload Section -->
  <div class="max-w-2xl mx-auto mt-12 bg-white p-8 rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold text-indigo-700 mb-6 text-center">Upload Student Data</h2>

    <form id="studentUploadForm" enctype="multipart/form-data"
      class="space-y-6 {% if needs_setup %}opacity-50 pointer-events-none{% endif %}">


      {% csrf_token %}
      <div>
        <label class="block text-gray-700 font-semibold mb-2">Choose Excel File</label>
        <input type="file" name="file" accept=".xls,.xlsx"
          class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="flex justify-center">
        <button type="submit"
          class="bg-indigo-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-indigo-700 transition shadow">
          Upload
        </button>
      </div>
    </form>

    <!-- Modal for showing messages -->
    <div id="uploadResultModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center">
      <div class="bg-white rounded-lg shadow-lg p-6 w-96">
        <h2 class="text-xl font-semibold mb-4" id="modalTitle"></h2>
        <div id="modalBody" class="text-gray-700"></div>
        <div class="mt-4 flex justify-end">
          <button onclick="closeModal()" class="bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700">
            Close
          </button>
        </div>
      </div>
    </div>


    <p class="text-gray-500 text-sm mt-6 text-center">
      Only Excel files (.xls, .xlsx) are allowed.
      <a href="{% url 'download-sample-file' %}" class="text-indigo-600 underline hover:text-indigo-800">
        Download sample template
      </a>
    </p>
  </div>


  <!-- Loader Overlay -->
  <div id="loader" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center z-50">
    <div class="w-16 h-16 border-4 border-white border-t-transparent rounded-full animate-spin"></div>
  </div>


  <!-- ✅ Header Menu Script -->


  <script>
    const form = document.getElementById("studentUploadForm");
    const modal = document.getElementById("uploadResultModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");

    const loader = document.getElementById("loader");


    function closeModal() {
      modal.classList.add("hidden");
    }



    // ✅ Show modal on page load if teams/categories missing
    document.addEventListener("DOMContentLoaded", function () {
      const needsSetup = "{{ needs_setup|yesno:'true,false' }}" === "true";

      if (needsSetup) {
        modalTitle.innerText = "⚠️ Setup Required";
        modalBody.innerHTML = `<p class="text-red-600">Please add <strong>teams</strong> and <strong>categories</strong> first!</p>`;
        modal.classList.remove("hidden");
      }
    });



    form.addEventListener("submit", async function (e) {
      e.preventDefault();

      let formData = new FormData(form);

      loader.classList.remove("hidden");

      try {
        let response = await fetch("{% url 'upload-students' %}", {
          method: "POST",
          body: formData,
          headers: {
            "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]").value
          }
        });

        let data = await response.json();

        if (response.ok) {
          modalTitle.innerText = "✅ Upload Successful";
          modalBody.innerHTML = `
          <p><strong>Created:</strong> ${data.created}</p>
          <p><strong>Skipped:</strong> ${data.skipped}</p>
          ${data.errors.length ? `<p class="text-red-600 mt-2">Errors:</p><ul class="list-disc ml-5 text-red-600">${data.errors.map(err => `<li>${err}</li>`).join("")}</ul>` : ""}
        `;
        } else {
          modalTitle.innerText = "❌ Upload Failed";
          modalBody.innerHTML = `<p class="text-red-600">${data.error || "Something went wrong"}</p>`;
        }

        modal.classList.remove("hidden");

      } catch (err) {
        modalTitle.innerText = "❌ Upload Failed";
        modalBody.innerHTML = `<p class="text-red-600">Error: ${err.message}</p>`;
        modal.classList.remove("hidden");
      } finally {
        // Hide loader regardless of success/failure
        loader.classList.add("hidden");
      }
    });
  </script>










</body>

</html>
